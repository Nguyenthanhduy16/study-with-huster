<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản trị · Học Online Cùng Huster</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="scene/hust3d.css">
<link rel="stylesheet" href="css/app.css">
<style>
  body { overflow: auto; background: var(--bg); }
  .ad { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  .ad-nav { position: sticky; top: 0; height: 100vh; padding: 18px 12px; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 4px; }
  .ad-nav .brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 16px; }
  .ad-nav button { text-align: left; padding: 10px 12px; border-radius: 10px; border: 0; background: none; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
  .ad-nav button.on { background: var(--accent); color: var(--accent-ink); }
  .ad-nav button:hover:not(.on) { background: var(--accent-soft); color: var(--ink); }
  .ad-nav .sp { flex: 1; }
  .ad-main { padding: 22px 26px 60px; min-width: 0; }
  .ad-main h1 { margin: 0 0 4px; font-size: 24px; }
  .ad-sub { color: var(--muted); margin: 0 0 18px; font-size: 13.5px; }
  .ad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .ad-kpi { padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .ad-kpi b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .ad-kpi span { font-size: 12.5px; color: var(--muted); }
  .ad-kpi.warn b { color: #c27a00; }
  .ad-box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .ad-box h2 { margin: 0 0 10px; font-size: 16px; }
  .ad-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .ad-bar .po-in { width: auto; flex: 1; min-width: 160px; }
  table.ad-t { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ad-t th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  .ad-t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .ad-t tr:hover td { background: var(--accent-soft); }
  .ad-scroll { overflow: auto; max-height: 64vh; border-radius: 10px; }
  .ad-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); margin: 1px 2px 1px 0; white-space: nowrap; }
  .ad-tag.g { background: rgba(34,168,97,.15); color: #138a4c; }
  .ad-tag.r { background: rgba(214,69,69,.13); color: #c03535; }
  .ad-tag.y { background: rgba(242,182,50,.2); color: #8a6100; }
  .ad-acts { display: flex; gap: 4px; flex-wrap: wrap; }
  .ad-acts button { font-size: 11.5px; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  .ad-acts button:hover { border-color: var(--accent); }
  .ad-acts button.d { color: #c03535; }
  .ad-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .ad-form label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; }
  .ad-form label.ck { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; font-size: 13.5px; }
  .ad-chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 10px; }
  .ad-chart div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .ad-chart i { width: 100%; max-width: 46px; background: var(--accent); border-radius: 6px 6px 2px 2px; min-height: 2px; }
  .ad-chart b { color: var(--ink); font-size: 11.5px; }
  .ad-login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .ad-login .po-card { width: min(400px, 100%); padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .ad-q { max-width: 420px; }
  .ad-pre { white-space: pre-wrap; font-size: 12.5px; }
  .ad-off { background: rgba(242,182,50,.18); border: 1px solid rgba(242,182,50,.5); padding: 10px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 14px; }
  @media (max-width: 860px) { .ad { grid-template-columns: 1fr; } .ad-nav { position: static; height: auto; flex-direction: row; flex-wrap: wrap; } .ad-nav .brand, .ad-nav .sp { display: none; } .ad-main { padding: 16px; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="po-toasts" class="po-toasts" style="bottom:24px"></div>
<div id="po-modal" class="po-modal" hidden></div>
<script src="config.js"></script>
<script src="js/util.js"></script>
<script src="js/questions-bank.js"></script>
<script>if (window.SUPABASE_URL) document.write('<script src="vendor/supabase/supabase.js"><\/script>');</script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/contrib/auto-render.min.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
