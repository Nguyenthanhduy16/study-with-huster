# Cấu hình Netlify cho Phòng ôn thi ảo (web tĩnh, không cần lệnh build).
# Kéo thả cả thư mục vào https://app.netlify.com/drop, hoặc nối repo Git: Netlify tự đọc file này.

[build]
  publish = "."
  command = ""

# ---------- Bảo mật: áp dụng cho mọi trang ----------
# CSP chỉ cho phép: file của chính trang web, Supabase (https + wss *.supabase.co), server realtime trên Railway
# (wss *.up.railway.app) và thời tiết Open-Meteo.
# Nếu dùng tên miền riêng cho Supabase hoặc cho server Railway, thêm tên miền đó (wss://…) vào connect-src.
# 'unsafe-inline' cần cho các đoạn <script>/<style> nhỏ viết thẳng trong index.html/admin.html.
# 'wasm-unsafe-eval' chỉ cho phép WebAssembly (bộ giải nén Draco của mô hình sân), không cho eval JavaScript.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co wss://*.up.railway.app https://api.open-meteo.com data: blob:; media-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# ---------- Bộ nhớ đệm ----------
# Trang và cấu hình: luôn hỏi lại máy chủ (sửa config.js là mọi người nhận ngay).
# js/, css/, scene/*.js không đặt gì ⇒ Netlify mặc định "max-age=0, must-revalidate" + ETag (đúng ý: cập nhật là thấy).
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

# Thư viện đóng gói sẵn (ít khi đổi): giữ 30 ngày. Nếu nâng cấp thư viện, đổi tên file/thư mục.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/scene/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Mô hình 3D sân trước (~9,4 MB): giữ 1 ngày, sau đó dùng bản cũ trong lúc tải bản mới.
[[headers]]
  for = "/scene/exterior/thu-vien-ta-quang-buu.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
# Ảnh logo/huy hiệu của tủ đồ và bộ giải nén Draco: ít khi đổi — giữ 7 ngày (đổi nội dung thì nên đổi tên file).
[[headers]]
  for = "/avatar/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/scene/vendor/draco/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Bản nén Draco của mô hình sân (web tải bản này; bản .glb gốc chỉ dùng khi trình duyệt không giải nén được).
[[headers]]
  for = "/scene/exterior/thu-vien-ta-quang-buu.draco.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/scene/exterior/luoi-di-chuyen.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Thư mục công cụ/tài liệu không cần cho người dùng — chặn khỏi máy tìm kiếm.
[[headers]]
  for = "/tools/*"
  [headers.values]
    X-Robots-Tag = "noindex"
